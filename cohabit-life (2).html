<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>同居日常:小雪的一年</title>
<style>
:root{
  --pink:#ff8fab; --pink-d:#e0577d; --cream:#fff6f0; --ink:#3a2a33;
  --panel:rgba(255,255,255,.93); --shadow:0 8px 24px rgba(80,30,50,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2a1b24;color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden}
#app{position:relative;width:100%;height:100dvh;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;background:#000;overflow:hidden}
/* HUD */
#hud{display:flex;gap:10px;align-items:center;padding:8px 12px;background:rgba(255,255,255,.92);font-size:13px;z-index:5;flex-wrap:wrap}
#hud .day{font-weight:700;color:var(--pink-d);white-space:nowrap}
.stat{display:flex;align-items:center;gap:6px;flex:1 1 120px;min-width:110px}
.stat label{white-space:nowrap}
.bar{flex:1;height:8px;background:#eadde2;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;transition:width .5s}
.bar.aff i{background:linear-gradient(90deg,#ff9bb5,#ff4f81)}
.bar.tru i{background:linear-gradient(90deg,#9bd0ff,#4f94ff)}
.money{font-weight:700;white-space:nowrap}
#yearbar{height:4px;background:#eadde2;z-index:5}
#yearbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb36b,#ff4f81);transition:width .6s}
/* stage */
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;transition:background 1s}
#stage.morning{background:linear-gradient(#ffe8c7,#ffd2b0 55%,#c99f86 55%,#a97f69)}
#stage.day{background:linear-gradient(#bfe6ff,#e9f7ff 55%,#c9a98d 55%,#a98a70)}
#stage.evening{background:linear-gradient(#ff9a76,#ffc9a0 55%,#8a6154 55%,#6e4a40)}
#stage.night{background:linear-gradient(#1c2447,#3a3f7a 55%,#4a3a45 55%,#33262e)}
#stage.rain{background:linear-gradient(#7a8da3,#a9b8c7 55%,#7d6a62 55%,#5d4d47)}
.deco{position:absolute;pointer-events:none}
#sun{top:9%;right:10%;width:clamp(40px,9vw,80px);aspect-ratio:1;border-radius:50%;background:#fff3a8;box-shadow:0 0 40px #fff3a8}
#stage.night #sun{background:#f3f3ff;box-shadow:0 0 30px #cfd6ff}
#stage.evening #sun{background:#ffd27a;box-shadow:0 0 50px #ff9a4d;top:22%}
#stage.rain #sun{display:none}
#window{left:6%;top:12%;width:clamp(70px,16vw,150px);aspect-ratio:1;border:6px solid #fff;border-radius:8px;background:rgba(255,255,255,.25);box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
#window:before,#window:after{content:"";position:absolute;background:#fff}
#window:before{left:50%;top:0;bottom:0;width:4px;margin-left:-2px}
#window:after{top:50%;left:0;right:0;height:4px;margin-top:-2px}
#rain{inset:0;display:none;background:repeating-linear-gradient(105deg,rgba(255,255,255,.35) 0 2px,transparent 2px 18px);animation:rain .5s linear infinite}
#stage.rain #rain{display:block}
@keyframes rain{to{background-position:-18px 40px}}
#char{height:100%;max-width:100%;display:flex;align-items:flex-end;justify-content:center;transition:opacity .3s}
.portrait{position:relative;height:100%;max-width:100%;display:flex;align-items:flex-end;justify-content:center;animation:float 4s ease-in-out infinite}
.portrait img{height:100%;width:auto;max-width:100%;object-fit:contain;object-position:center bottom;display:block;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.3));user-select:none;-webkit-user-drag:none;pointer-events:none}
.portrait .emo{position:absolute;top:6%;right:4%;font-size:clamp(26px,6vw,44px);animation:emo 1.2s ease-in-out infinite;text-shadow:0 2px 6px rgba(0,0,0,.3)}
.portrait.happy{animation:bounce .6s ease-out 1,float 4s ease-in-out .6s infinite}
.portrait.surprised{animation:jump .45s ease-out 1,float 4s ease-in-out .45s infinite}
.portrait.shy{transform-origin:50% 100%;animation:tilt 3s ease-in-out infinite}
.portrait.sad{transform:translateY(8px)}
.portrait.sad img{filter:saturate(.75) brightness(.93) drop-shadow(0 6px 12px rgba(0,0,0,.3))}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}}
@keyframes jump{0%,100%{transform:translateY(0)}35%{transform:translateY(-28px)}}
@keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(1.6deg)}}
@keyframes emo{50%{transform:translateY(-8px) scale(1.12)}}
.hero{max-height:clamp(110px,24vh,280px);width:auto;max-width:60%;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(0,0,0,.25));user-select:none}
.screen{overflow-y:auto}
@media (max-height:500px) and (orientation:landscape){.hero{display:none}}
#char.hidden{opacity:0}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;left:50%;top:35%;font-weight:800;font-size:clamp(18px,4vw,28px);color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5);animation:pop 1.4s ease-out forwards}
@keyframes pop{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
/* dialog */
#dialog{position:relative;z-index:6;margin:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:var(--panel);
  min-height:clamp(120px,24vh,190px);cursor:pointer;border-top:4px solid var(--pink);box-shadow:0 -6px 20px rgba(0,0,0,.2)}
#name{display:inline-block;background:var(--pink-d);color:#fff;font-weight:700;padding:2px 14px;border-radius:14px;font-size:14px;margin-bottom:6px;min-height:22px}
#name:empty{visibility:hidden}
#text{font-size:clamp(15px,2.2vw,19px);line-height:1.7;white-space:pre-wrap}
#next{position:absolute;right:18px;bottom:10px;color:var(--pink-d);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
/* choices */
#choices{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;justify-content:center;gap:12px;padding:20px;background:rgba(30,15,25,.45);align-items:center}
#choices.show{display:flex}
#choices h3{margin:0 0 4px;color:#fff;font-size:clamp(16px,2.6vw,20px);text-shadow:0 2px 6px #000;text-align:center;max-width:640px}
.opt{width:min(640px,100%);padding:14px 16px;border:0;border-radius:14px;background:#fff;color:var(--ink);font-size:clamp(15px,2.2vw,18px);
  text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,background .12s;font-family:inherit}
.opt:hover,.opt:focus-visible{transform:translateY(-2px);background:#ffe3ec;outline:none}
.opt b{color:var(--pink-d);margin-right:8px}
.opt small{display:block;color:#8a6f7a;margin-top:2px}
/* overlay screens */
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
  background:linear-gradient(160deg,#ffd9e4,#ffeede 50%,#d9e8ff);color:var(--ink)}
.screen.hide{display:none}
.screen h1{margin:0;font-size:clamp(28px,6vw,52px);color:var(--pink-d);letter-spacing:2px}
.screen p{margin:0;max-width:520px;line-height:1.8;font-size:clamp(14px,2.2vw,17px)}
.btn{padding:12px 34px;border:0;border-radius:30px;background:var(--pink-d);color:#fff;font-size:18px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);font-family:inherit}
.btn.alt{background:#fff;color:var(--pink-d)}
.btn:hover{filter:brightness(1.08)}
.badge{font-size:12px;background:#fff;border-radius:12px;padding:3px 10px;color:#8a6f7a}
#ending .stats{font-size:15px;background:rgba(255,255,255,.7);padding:10px 18px;border-radius:12px}
@media (min-width:800px){
  #app{border-radius:16px;margin-top:2vh;height:96dvh}
  #char{max-height:none}
}
@media (max-width:480px){
  #hud{font-size:12px;gap:6px;padding:6px 10px}
  .stat{min-width:90px}
}
@media (max-height:500px) and (orientation:landscape){
  #dialog{min-height:90px}
  #hud{padding:4px 10px}
}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="day" id="dayLabel">3月1日 · 第 1 / 365 天</span>
    <div class="stat"><label>好感</label><div class="bar aff"><i id="affBar"></i></div></div>
    <div class="stat"><label>信任</label><div class="bar tru"><i id="truBar"></i></div></div>
    <span class="money" id="money">$5000</span>
  </div>
  <div id="yearbar"><i id="yearFill"></i></div>
  <div id="stage" class="morning">
    <div class="deco" id="sun"></div>
    <div class="deco" id="window"></div>
    <div class="deco" id="rain"></div>
    <div id="char"></div>
    <div id="fx"></div>
    <div id="choices"></div>
  </div>
  <div id="dialog">
    <div id="name"></div>
    <div id="text"></div>
    <div id="next">▼</div>
  </div>

  <div class="screen" id="title">
    <img class="hero" id="heroTitle" alt="小雪" draggable="false">
    <span class="badge">全年齡 · 互動視覺小說</span>
    <h1>同居日常<br>小雪的一年</h1>
    <p>為了分攤房租,你把多出來的房間租給了一位大學生——小雪。<br>
    從三月到隔年二月,整整 365 天的同居生活,每個選擇都會改變你們的關係。<br>平常每週選一種過法,遇到重要日子會觸發劇情。<br>
    <small>操作:點擊畫面或按 空白鍵/Enter 繼續;選項可點擊或按 1 2 3。</small></p>
    <button class="btn" id="startBtn">開始遊戲</button>
    <button class="btn alt" id="contBtn" style="display:none">繼續上次進度</button>
  </div>

  <div class="screen hide" id="ending">
    <img class="hero" id="heroEnd" alt="小雪" draggable="false">
    <h1 id="endTitle"></h1>
    <p id="endText"></p>
    <div class="stats" id="endStats"></div>
    <button class="btn" id="againBtn">再玩一次</button>
  </div>
</div>

function dateOf(d){
  d=Math.max(0,Math.min(TOTAL-1,d));let m=0;
  while(m<11&&d>=MONTHS[m][1]){d-=MONTHS[m][1];m++;}
  return {m:MONTHS[m][0],d:d+1,mi:m};
}
function dateStr(d){const x=dateOf(d);return x.m+x.d+"日";}
function bgFor(d){
  if(((d*7919)%100)<14)return "rain";
  const mi=dateOf(d).mi;
  return mi<=2?"morning":mi<=5?"day":mi<=8?"evening":"night";
}

/* ---------- 狀態 ---------- */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const SAVE="cohabit_xiaoxue_v2";
let S, queue=[], typing=false, fullText="", timer=null, waitingChoice=false, currentChoices=null, currentAfter=null, currentIsPlan=false;

function newState(){return {day:0,ei:0,aff:15,trust:15,money:5000,flags:{cat:0}};}
function save(){try{localStorage.setItem(SAVE,JSON.stringify({day:S.day,ei:S.ei,aff:S.aff,trust:S.trust,money:S.money,flags:S.flags}));}catch(e){}}
function load(){try{const r=localStorage.getItem(SAVE);return r?JSON.parse(r):null;}catch(e){return null;}}
function clearSave(){try{localStorage.removeItem(SAVE);}catch(e){}}

function updateHUD(){
  const d=Math.min(S.day,TOTAL-1);
  $("dayLabel").textContent=dateStr(d)+" · 第 "+(d+1)+" / "+TOTAL+" 天";
  $("affBar").style.width=S.aff+"%";
  $("truBar").style.width=S.trust+"%";
  $("money").textContent="$"+S.money;
  $("yearFill").style.width=(Math.min(S.day,TOTAL)/TOTAL*100)+"%";
}
function popFx(txt){
  const el=document.createElement("div");el.className="pop";el.textContent=txt;
  el.style.marginLeft=(Math.random()*60-30)+"px";
  $("fx").appendChild(el);setTimeout(()=>el.remove(),1500);
}
function setChar(expr){
  if(expr===null||expr===undefined){ $("char").classList.add("hidden"); return;}
  $("char").classList.remove("hidden");$("char").innerHTML=girl(expr);
}
function setBg(bg){ $("stage").className=bg; }

/* ---------- 對話引擎 ---------- */
function typeLine(who,text,expr,hideChar){
  $("name").textContent=who||"";
  if(hideChar){ setChar(null);} else if(who===XS){ setChar(expr||"normal"); }
  else if(expr){ setChar(expr); }
  fullText=text;$("text").textContent="";$("next").style.visibility="hidden";
  let i=0;typing=true;clearInterval(timer);
  timer=setInterval(()=>{
    i++;$("text").textContent=fullText.slice(0,i);
    if(i>=fullText.length){finishTyping();}
  },28);
}
function finishTyping(){
  clearInterval(timer);typing=false;$("text").textContent=fullText;$("next").style.visibility="visible";
}
function advance(){
  if(waitingChoice)return;
  if(typing){finishTyping();return;}
  if(!$("title").classList.contains("hide")||!$("ending").classList.contains("hide"))return;
  next();
}
function next(){
  if(!queue.length)return;
  const it=queue.shift();
  if(it.type==="line"){typeLine(it.who,it.text,it.expr,it.hide);}
  else if(it.type==="choice"){showChoices(it);}
  else if(it.type==="apply"){applyFx(it.fx,it.scale);next();}
  else if(it.type==="after"){it.fn();}
}
function pushLines(arr){
  arr.forEach(l=>queue.push({type:"line",who:l[0],text:l[1],expr:l[2]||(l[0]===XS?"normal":null),hide:!!l[3]}));
}

/* 流程控制:事件 / 每週行動 */
function step(){
  if(S.day>=TOTAL&&S.ei>=EVENTS.length){return showEnding();}
  const ev=EVENTS[S.ei];
  if(ev&&S.day>=ev.d){return playEvent(ev);}
  planWeek(ev?ev.d:TOTAL);
}
function playEvent(ev){
  S.day=ev.d;updateHUD();setBg(ev.bg);
  queue=[];
  queue.push({type:"line",who:"",text:"—— "+dateStr(ev.d)+":"+ev.title+" ——",expr:null,hide:true});
  pushLines(typeof ev.lines==="function"?ev.lines(S):ev.lines);
  queue.push({type:"choice",q:ev.q,opts:ev.opts,plan:false,after:()=>{S.ei++;S.day=ev.d+1;save();step();}});
  next();
}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function planWeek(limit){
  const days=Math.max(1,Math.min(7,limit-S.day));
  setBg(bgFor(S.day));updateHUD();
  const money=PLANS.filter(p=>p.kind==="money"),social=PLANS.filter(p=>p.kind==="social"),care=PLANS.filter(p=>p.kind==="care");
  const chosen=[pick(money),pick(social),pick(care)];
  const opts=chosen.map(p=>{
    const f=Object.assign({},p.fx);
    f.money=(f.money||0)+Math.round(BASE_WEEK_MONEY*days/7);
    return {t:p.t,sub:p.sub,fx:f,reply:pick(p.flav)};
  });
  queue=[];
  const span=days>1?(dateStr(S.day)+" 起的 "+days+" 天"):dateStr(S.day);
  queue.push({type:"line",who:"",text:"—— "+span+" ——\n平淡的日子裡,你打算怎麼過?",expr:null,hide:true});
  queue.push({type:"choice",q:"這段時間的重心是……",opts:opts,plan:true,after:()=>{S.day+=days;save();step();}});
  next();
}
function showChoices(it){
  waitingChoice=true;currentChoices=it.opts;currentAfter=it.after;currentIsPlan=it.plan;
  const box=$("choices");box.innerHTML="";
  const h=document.createElement("h3");h.textContent=it.q;box.appendChild(h);
  it.opts.forEach((o,i)=>{
    const b=document.createElement("button");b.className="opt";
    b.innerHTML="<b>"+(i+1)+"</b>"+escapeHtml(o.t)+(o.sub?"<small>"+escapeHtml(o.sub)+"</small>":"");
    b.addEventListener("click",e=>{e.stopPropagation();choose(i);});
    box.appendChild(b);
  });
  box.classList.add("show");
  const first=box.querySelector(".opt");if(first)first.focus({preventScroll:true});
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function choose(i){
  if(!waitingChoice||!currentChoices[i])return;
  const o=currentChoices[i];
  waitingChoice=false;$("choices").classList.remove("show");
  queue=[{type:"apply",fx:o.fx,scale:!currentIsPlan}];
  pushLines(o.reply);
  queue.push({type:"after",fn:currentAfter});
  next();
}
function applyFx(fx,scale){
  const k=scale?EVT:WEEK_K;
  const a=r1((fx.aff||0)*k),t=r1((fx.trust||0)*k),m=fx.money||0;
  S.aff=r1(clamp(S.aff+a,0,100));S.trust=r1(clamp(S.trust+t,0,100));S.money+=m;
  if(fx.flag)Object.assign(S.flags,fx.flag);
  updateHUD();
  if(a)popFx("好感 "+fmt(a));
  if(t)setTimeout(()=>popFx("信任 "+fmt(t)),350);
  if(m)setTimeout(()=>popFx("$"+(m>0?"+":"")+m),700);
}

/* ---------- 結局 ---------- */
function showEnding(){
  const score=S.aff+S.trust;let title,text;
  if(S.aff>=85&&S.trust>=80){
    title="🏠 一生的家";
    text="租約續了一年又一年。小雪畢業、工作,卻始終沒有搬離這個家。\n這個曾經只是『分攤房租』的地方,已經變成彼此最安心的歸處。";
  }else if(S.aff>=65&&S.trust>=60){
    title="🎓 一起走下去";
    text="小雪順利升上大四,你們依舊住在一起。\n日子平凡,卻一天比一天踏實;窗邊的那盞燈,始終為彼此留著。";
  }else if(S.aff>=48&&S.trust>=44){
    title="☕ 貼心的好室友";
    text="一年過去,你們成了無話不談的好朋友。\n即使之後各自忙碌,逢年過節她都會傳訊息來:「家裡還好嗎?」";
  }else if(score>=70){
    title="🌤️ 普通的室友";
    text="日子照常往前走。你們互相禮貌、互不打擾。\n也許再多一點用心,故事會有不一樣的走向。";
  }else{
    title="🌧️ 各自離去";
    text="租約到期那天,小雪安靜地收拾好行李,留下鑰匙和一張謝謝的紙條。\n有些緣分,需要更多的關心才留得住。";
  }
  if(S.flags.cat>=2)text+="\n\n(家裡那隻橘貓,早就是全家的老大了。)";
  const rich=S.money>=20000?"存款相當充裕,生活無憂。":(S.money>=10000?"存款還算穩健。":(S.money>=3000?"存款勉強夠用。":"荷包見底,下個月要省著點花了。"));
  $("endTitle").textContent=title;$("endText").textContent=text;
  $("endStats").innerHTML="好感 <b>"+Math.round(S.aff)+"</b> · 信任 <b>"+Math.round(S.trust)+"</b> · 存款 <b>$"+S.money+"</b><br>"+rich;
  $("ending").classList.remove("hide");
  clearSave();
}

/* ---------- 啟動 ---------- */
function begin(state){
  S=state;$("title").classList.add("hide");$("ending").classList.add("hide");
  $("choices").classList.remove("show");waitingChoice=false;
  updateHUD();step();
}
$("startBtn").addEventListener("click",e=>{e.stopPropagation();clearSave();begin(newState());});
$("contBtn").addEventListener("click",e=>{e.stopPropagation();const l=load();if(l){begin({day:l.day,ei:l.ei,aff:l.aff,trust:l.trust,money:l.money,flags:l.flags||{cat:0}});}});
$("againBtn").addEventListener("click",e=>{e.stopPropagation();begin(newState());});
$("dialog").addEventListener("click",advance);
$("stage").addEventListener("click",e=>{if(e.target.closest("#choices"))return;advance();});

document.addEventListener("keydown",e=>{
  if(waitingChoice){
    const n=parseInt(e.key,10);
    if(n>=1&&n<=3){choose(n-1);e.preventDefault();}
    return;
  }
  if(e.key===" "||e.key==="Enter"){
    if(e.target&&e.target.tagName==="BUTTON")return;
    advance();e.preventDefault();
  }
});

const saved=load();
if(saved&&saved.day>0&&saved.day<TOTAL){$("contBtn").style.display="";}
S=newState();updateHUD();$("char").innerHTML=girl("happy");
$("heroTitle").src=IMG.full;$("heroEnd").src=IMG.full;

})();
</script>
